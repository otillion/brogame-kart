<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.svg">
<title>BroGame Game Kart</title>
<meta name="theme-color" content="#0d0c1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Russo+One&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow "game card" column on a dark lounge floor; the stars live on a mini billiard table (indigo cushion rail, purple felt). */
:root{
  --night:#0d0c1c;        /* lounge floor */
  --night-2:#16142e;      /* raised surface */
  --felt:#33246b;         /* table felt */
  --felt-deep:#1f1647;
  --rail:#55518b;         /* BroGame logo indigo = cushion rail */
  --rail-dark:#3b3873;
  --chalk:#f4f2ff;        /* text */
  --muted:#aaa5d8;
  --line:#2d2a52;
  --accent:#5cc8ff;       /* cue-chalk blue */
  --accent-ink:#06121c;
  --gold:#ffd166;         /* free hour */
  --ok:#3ddc97; --err:#ff6b81; --warn:#ffb454;
  --f-display:"Russo One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-digit:"Chakra Petch","Rubik",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--chalk)}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.5;
  background:
    radial-gradient(900px 520px at 50% -180px,#2a1f63 0%,transparent 70%),
    radial-gradient(600px 400px at 110% 110%,#1b2350 0%,transparent 70%),
    var(--night);
  min-height:100vh;
}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1000px}

/* demo strip */
.demo{background:#2a2350;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);padding-inline:16px;padding-block:8px}
.demo .in{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.demo nav{display:flex;gap:6px;flex-wrap:wrap}
.demo nav a{color:var(--chalk);text-decoration:none;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--night-2)}
.demo nav a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* header */
.top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--rail),0 6px 18px rgba(0,0,0,.4)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.02em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.langs{display:flex;background:var(--night-2);border:1px solid var(--line);border-radius:99px;padding:2px}
.langs button{border:0;background:transparent;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.langs button.on{background:var(--rail);color:var(--chalk)}

/* panels */
.panel{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15}
h2{font-family:var(--f-display);font-weight:400;font-size:19px}
p{margin:0}
.muted{color:var(--muted)}

/* billiard table */
.table{
  position:relative;border-radius:22px;padding:14px;width:100%;align-self:stretch;
  background:linear-gradient(180deg,var(--rail) 0%,var(--rail-dark) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 14px 34px rgba(0,0,0,.45);
}
.table::before,.table::after{ /* rail sights (diamonds) */
  content:"";position:absolute;left:18%;right:18%;height:5px;top:5px;
  background:radial-gradient(circle,#e8e4ff 1.6px,transparent 2.2px) 0 50%/25% 100% repeat-x;opacity:.75;
}
.table::after{top:auto;bottom:5px}
.felt{
  position:relative;border-radius:12px;padding:18px 12px;
  background:radial-gradient(120% 140% at 50% 40%,var(--felt) 0%,var(--felt-deep) 100%);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),inset 0 8px 18px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;gap:clamp(3px,1.4cqi,10px);
}
.table .felt{container-type:inline-size;padding-inline:8px}
.table .ball{--s:min(46px,11.2cqi)}
.pocket{position:absolute;width:14px;height:14px;border-radius:50%;background:#07060f;box-shadow:inset 0 2px 3px rgba(0,0,0,.8)}
.pocket.tl{top:-5px;left:-5px}.pocket.tr{top:-5px;right:-5px}.pocket.bl{bottom:-5px;left:-5px}.pocket.br{bottom:-5px;right:-5px}
.string{width:2px;align-self:stretch;margin-inline:2px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)}

.ball{
  --c:#888;--s:40px;
  width:var(--s);height:var(--s);border-radius:50%;flex:none;position:relative;
  display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 6%,transparent 22%),
             radial-gradient(circle at 50% 50%,var(--c) 55%,color-mix(in srgb,var(--c) 55%,#000) 100%);
  box-shadow:0 4px 8px rgba(0,0,0,.45);
}
.ball i{font-style:normal;font-family:var(--f-digit);font-weight:700;font-size:calc(var(--s)*.3);color:#111;
  width:46%;height:46%;border-radius:50%;background:#fbfaf5;display:grid;place-items:center;line-height:1}
.ball.off{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);}
.ball.off i{background:transparent;color:rgba(255,255,255,.28)}
.b1{--c:#f4c20d}.b2{--c:#2456d6}.b3{--c:#d62839}.b4{--c:#7a35b0}.b5{--c:#f26b1d}.b6{--c:#1f9a57}.b8{--c:#14131a}
.ball.b8:not(.off){box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(255,209,102,.55),0 4px 8px rgba(0,0,0,.45)}
.ball.b8.off{box-shadow:inset 0 0 0 2px rgba(255,209,102,.35)}
.ball.b8.off i{color:rgba(255,209,102,.5)}
.ball.new{animation:roll .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes roll{0%{transform:translateX(-140px) rotate(-540deg);opacity:0}70%{transform:translateX(6px) rotate(15deg);opacity:1}100%{transform:none}}
.mini .ball{--s:22px}
.mini.felt{padding:6px 8px;gap:4px;border-radius:99px;display:inline-flex}

.score{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--f-digit);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.score .big span{color:var(--muted);font-size:22px}

/* code entry */
.codebox{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.cell{height:62px;border-radius:12px;background:var(--night);border:1.5px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-digit);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.cell.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(92,200,255,.18)}
.codebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:text;border:0}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#241a00}
.btn.small{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.google{background:#fff;color:#1f1f1f;width:100%}
.btn.google svg{width:20px;height:20px}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;border:1px solid}
.msg.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.msg.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:color-mix(in srgb,var(--err) 10%,transparent)}
.msg.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}

.reward{border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:linear-gradient(160deg,#2b2412 0%,var(--night-2) 60%)}
.reward h2{color:var(--gold)}
.who{display:flex;gap:10px;align-items:center;background:var(--night);border-radius:12px;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--gold) 45%,transparent)}
.who b{display:block}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;background:var(--rail);display:grid;place-items:center;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

.steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--felt);border:1px solid var(--rail);
  display:grid;place-items:center;font-family:var(--f-digit);font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--night);border:1px solid var(--line);color:var(--muted)}
.chip.ready{color:#241a00;background:var(--gold);border-color:var(--gold);font-weight:700}

.foot{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.foot a{color:var(--chalk);text-decoration:none;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}

/* sign-in hero */
.hero{text-align:center;align-items:center}
.hero .logo{width:112px;height:112px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--rail),0 0 0 9px rgba(85,81,139,.25),0 18px 40px rgba(0,0,0,.5)}

/* modal (demo login / confirmations) */
.sheet{position:fixed;inset:0;background:rgba(5,4,14,.7);display:grid;place-items:center;padding:16px;z-index:20}
.sheet .panel{width:min(400px,100%)}
.field{display:flex;flex-direction:column;gap:6px}
.field input{background:var(--night);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.field input:focus{border-color:var(--accent);outline:none}

/* code screen (owner TV/tablet) */
.screen{min-height:calc(100vh - 40px);display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;max-width:1100px;margin:0 auto;padding-inline:24px;padding-block:24px}
.screen .left{display:flex;flex-direction:column;gap:18px;min-width:0}
.screen h1{font-size:clamp(26px,4vw,44px)}
.digits{display:flex;gap:clamp(6px,1.2vw,14px);direction:ltr}
.digits span{font-family:var(--f-digit);font-weight:700;font-size:clamp(56px,11vw,150px);line-height:1;
  background:var(--felt-deep);border:2px solid var(--rail);border-radius:18px;padding:.08em .14em;min-width:.9em;text-align:center;
  box-shadow:inset 0 6px 16px rgba(0,0,0,.4)}
.timer{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:clamp(14px,1.6vw,20px)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden;max-width:520px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s linear}
.qr{background:#fff;padding:14px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#1b1838;max-width:100%}
.qr p{font-size:13px;font-weight:500;text-align:center;max-width:200px}
.flash{position:fixed;inset:0;display:grid;place-items:center;background:rgba(13,12,28,.88);z-index:30;text-align:center}
.flash div{display:flex;flex-direction:column;gap:14px;align-items:center}
.flash .ball{--s:120px}
.flash h2{font-size:clamp(28px,5vw,54px);color:var(--ok)}
@media (max-width:760px){.screen{grid-template-columns:1fr}.qr{justify-self:start}}

/* admin */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-digit);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.hl b{color:var(--gold)}
.list{display:flex;flex-direction:column}
.cust{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.cust:first-child{border-top:0}
.cust .nm{min-width:0}
.cust .nm b,.cust .nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust .nm small{color:var(--muted);font-size:12.5px}
.cust .act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.search{background:var(--night);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;width:100%}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:last-child{grid-column:span 2}.cust{grid-template-columns:auto minmax(0,1fr)}.cust .act{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}

[dir=rtl] .brand small{letter-spacing:0}
[dir=rtl] .eyebrow{letter-spacing:0}
@media (prefers-reduced-motion:reduce){.ball.new{animation:none}.bar i{transition:none}}
</style>
</head>

function bad(code){ const e=new Error(code); e.code=code; return e; }

function makeDemo(){
  const KEY="brogame_demo_v1"; let mem=null; const subs=new Set();
  const read=()=>{ try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return mem; };
  const write=d=>{ mem=d; try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} subs.forEach(f=>f()); };
  if(!read()){
    const now=Date.now();
    write({ session:"demo-ahmet", codes:{}, customers:{
      "demo-ahmet":{name:"Ahmet Yılmaz (örnek)",email:"ahmet.ornek@gmail.com",photo:"",stars:4,rewards:1,lastStarAt:now-7200000,createdAt:now-86400000*20},
      "demo-zeynep":{name:"Zeynep K. (örnek)",email:"zeynep.ornek@gmail.com",photo:"",stars:6,rewards:0,lastStarAt:now-3600000,createdAt:now-86400000*9},
      "demo-omar":{name:"Omar H. (örnek)",email:"omar.ornek@gmail.com",photo:"",stars:2,rewards:3,lastStarAt:now-86400000,createdAt:now-86400000*60},
      "demo-elif":{name:"Elif D. (örnek)",email:"elif.ornek@gmail.com",photo:"",stars:5,rewards:2,lastStarAt:now-5400000,createdAt:now-86400000*33}
    }});
  }
  window.addEventListener("storage",e=>{ if(e.key===KEY) subs.forEach(f=>f()); });
  const userOf=d=> d.session && d.customers[d.session] ? {uid:d.session, ...d.customers[d.session]} : null;
  return {
    demo:true,
    onAuth(cb){ let last; const f=()=>{ const u=userOf(read()); const k=u&&u.uid; if(k!==last){ last=k; cb(u&&{uid:u.uid,name:u.name,email:u.email,photo:u.photo}); } }; subs.add(f); f(); },
    async signIn(){ S.sheet="demoLogin"; render(); },
    async demoCreate(name){
      const d=read(); const uid="demo-"+Math.random().toString(36).slice(2,8);
      d.customers[uid]={name,email:name.toLowerCase().replace(/[^a-z0-9]+/g,".").replace(/^\.|\.$/g,"")+"@gmail.com",photo:"",stars:0,rewards:0,lastStarAt:null,createdAt:Date.now()};
      d.session=uid; write(d);
    },
    async signOut(){ const d=read(); d.session=null; write(d); },
    watchCustomer(uid,cb){ const f=()=>{ const c=read().customers[uid]; cb(c?{uid,...c}:null); }; subs.add(f); f(); return ()=>subs.delete(f); },
    async ensureCustomer(){},
    async redeem(uid,code){
      const d=read(); const c=d.codes[code]; const now=Date.now(); const cu=d.customers[uid];
      if(!c || c.used || now-c.createdAt>CONFIG.codeValidSeconds*1000) throw bad("invalid");
      if(cu.stars>=CONFIG.starsForReward) throw bad("full");
      if(cu.lastStarAt && now-cu.lastStarAt<cooldownMs()) throw bad("cooldown");
      c.used=true; c.usedBy=uid; c.usedAt=now; cu.stars+=1; cu.lastStarAt=now; cu.lastCode=code; write(d);
    },
    watchCustomers(cb){ const f=()=>{ const d=read(); cb(Object.entries(d.customers).map(([uid,c])=>({uid,...c}))); }; subs.add(f); f(); return ()=>subs.delete(f); },
    async giveReward(uid){ const d=read(); const c=d.customers[uid]; if(c.stars<CONFIG.starsForReward) throw bad("invalid"); c.stars=0; c.rewards+=1; c.lastRedeemAt=Date.now(); write(d); },
    async issueCode(code){ const d=read(); d.codes[code]={used:false,usedBy:null,usedAt:null,createdAt:Date.now()};
      for(const k in d.codes) if(Date.now()-d.codes[k].createdAt>180000) delete d.codes[k]; write(d); },
    watchCode(code,cb){ const f=()=>cb(read().codes[code]||null); subs.add(f); return ()=>subs.delete(f); },
    async deleteCode(){}
  };
}

async function makeFirebase(){
  const base="https://www.gstatic.com/firebasejs/10.12.2/";
  const [A,Au,F]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
  const app=A.initializeApp(CONFIG.firebase);
  const auth=Au.getAuth(app); const db=F.getFirestore(app);
  const provider=new Au.GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
  const ms=v=> v&&v.toMillis? v.toMillis() : (v??null);
  const mapC=(id,d)=>({uid:id,...d,lastStarAt:ms(d.lastStarAt),createdAt:ms(d.createdAt),lastRedeemAt:ms(d.lastRedeemAt)});
  Au.getRedirectResult(auth).catch(()=>{});
  return {
    demo:false,
    onAuth(cb){ Au.onAuthStateChanged(auth,u=>cb(u&&{uid:u.uid,name:u.displayName||u.email,email:u.email,photo:u.photoURL||""})); },
    async signIn(){
      try{ await Au.signInWithPopup(auth,provider); }
      catch(e){
        if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) return Au.signInWithRedirect(auth,provider);
        if(e.code!=="auth/popup-closed-by-user") throw e;
      }
    },
    signOut(){ return Au.signOut(auth); },
    async ensureCustomer(u){
      const ref=F.doc(db,"customers",u.uid); const snap=await F.getDoc(ref);
      if(!snap.exists()){
        await F.setDoc(ref,{name:u.name||"",email:u.email,photo:u.photo||"",stars:0,rewards:0,createdAt:F.serverTimestamp(),lastStarAt:null,lastCode:null});
      } else if(snap.data().name!==u.name || snap.data().photo!==u.photo){
        await F.updateDoc(ref,{name:u.name||"",photo:u.photo||""}).catch(()=>{});
      }
    },
    watchCustomer(uid,cb){ return F.onSnapshot(F.doc(db,"customers",uid),s=>cb(s.exists()?mapC(s.id,s.data()):null),()=>cb(null)); },
    async redeem(uid,code){
      const b=F.writeBatch(db);
      b.update(F.doc(db,"codes",code),{used:true,usedBy:uid,usedAt:F.serverTimestamp()});
      b.update(F.doc(db,"customers",uid),{stars:F.increment(1),lastStarAt:F.serverTimestamp(),lastCode:code});
      try{ await b.commit(); }catch(e){ throw bad("invalid"); }
    },
    watchCustomers(cb,onErr){ return F.onSnapshot(F.query(F.collection(db,"customers"),F.orderBy("stars","desc")),
      s=>cb(s.docs.map(d=>mapC(d.id,d.data()))), e=>onErr&&onErr(e)); },
    giveReward(uid){ return F.updateDoc(F.doc(db,"customers",uid),{stars:0,rewards:F.increment(1),lastRedeemAt:F.serverTimestamp()}); },
    issueCode(code){ return F.setDoc(F.doc(db,"codes",code),{used:false,usedBy:null,usedAt:null,createdAt:F.serverTimestamp()}); },
    watchCode(code,cb){ return F.onSnapshot(F.doc(db,"codes",code),s=>cb(s.exists()?s.data():null),()=>{}); },
    deleteCode(code){ return F.deleteDoc(F.doc(db,"codes",code)).catch(()=>{}); }
  };
}

function ballsHTML(stars,{mini=false,newIdx=-1}={}){
  const n=CONFIG.starsForReward; let h="";
  for(let i=1;i<=n;i++){
    const on=i<=stars;
    h+=`<span class="ball b${((i-1)%6)+1} ${on?"":"off"} ${i-1===newIdx?"new":""}" aria-hidden="true"><i>${i}</i></span>`;
  }
  const full=stars>=n;
  h+=`<span class="string" aria-hidden="true"></span><span class="ball b8 ${full?"":"off"} ${full&&newIdx===n-1?"new":""}" aria-hidden="true"><i>8</i></span>`;
  const label=`<span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">${stars} / ${n}</span>`;
  if(mini) return `<span class="felt mini" role="img" aria-label="${stars} / ${n}">${h}</span>`;
  return `<div class="table" role="img" aria-label="${stars} / ${n}"><div class="felt"><span class="pocket tl"></span><span class="pocket tr"></span><span class="pocket bl"></span><span class="pocket br"></span>${h}${label}</div></div>`;

function wireCode(){
  const inp=$("#code"); if(!inp) return;
  const paint=()=>{ const v=inp.value; document.querySelectorAll("[data-cell]").forEach((c,i)=>{ c.textContent=v[i]||""; c.classList.toggle("cur", document.activeElement===inp && i===Math.min(v.length,4)); }); };
  inp.addEventListener("input",()=>{ inp.value=inp.value.replace(/\D/g,"").slice(0,5); paint(); if(inp.value.length===5) claim(); });
  inp.addEventListener("focus",paint); inp.addEventListener("blur",paint);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") claim(); });
  if(S.keepCode){ inp.value=S.keepCode; S.keepCode=null; } paint();
}
async function claim(){
  const inp=$("#code"); if(!inp || S.busy) return;
  const code=inp.value; const c=S.customer;
  if(code.length!==5){ S.msg={k:"err",t:t("short")}; return render(); }
  if((c.stars||0)>=CONFIG.starsForReward){ S.msg={k:"warn",t:t("full")}; return render(); }
  const wait=c.lastStarAt? c.lastStarAt+cooldownMs()-Date.now() : 0;
  if(wait>0){ S.msg={k:"warn",t:t("cooldown",{m:fmtN(Math.max(1,Math.ceil(wait/60000)))})}; return render(); }
  S.busy=true; S.msg=null; render();
  try{
    const before=c.stars||0;
    await backend.redeem(S.user.uid,code);
    S.justEarnedPending=before; S.msg={k:"ok",t:t("ok")};
  }catch(e){ S.msg={k:"err",t:t(e.code==="cooldown"?"cooldown":e.code==="full"?"full":"invalid",{m:fmtN(1)})}; }
  S.busy=false; render();
}

/* ---------------- owner: code screen ---------------- */
const SCR={on:false,code:null,issuedAt:0,timer:null,unwatch:null,given:0,issuing:false,old:[],qrDone:false,lock:null};
function genCode(){ const a=new Uint32Array(1); let c; do{ crypto.getRandomValues(a); c=String(a[0]%100000).padStart(5,"0"); }while(c===SCR.code); return c; }
async function issue(){
  if(SCR.issuing) return; SCR.issuing=true;
  try{
    const code=genCode(); await backend.issueCode(code);
    if(SCR.unwatch) SCR.unwatch();
    if(SCR.code) SCR.old.push({c:SCR.code,at:Date.now()});
    SCR.code=code; SCR.issuedAt=Date.now();
    SCR.unwatch=backend.watchCode(code,d=>{ if(d&&d.used&&SCR.code===code){ SCR.given++; flash(); issue(); } });
    SCR.old=SCR.old.filter(o=>{ if(Date.now()-o.at>90000){ backend.deleteCode(o.c); return false; } return true; });
    paintScreen(true);
  }catch(e){ const l=$("#left"); if(l) l.textContent=t("err"); }
  SCR.issuing=false;
}
function paintScreen(full){
  const left=Math.max(0,CONFIG.codeSeconds-(Date.now()-SCR.issuedAt)/1000);
  const bar=$("#bar"), lt=$("#left"), dg=$("#digits");
  if(bar) bar.style.width=(left/CONFIG.codeSeconds*100)+"%";
  if(lt) lt.textContent=t("newIn",{s:fmtN(Math.ceil(left))});
  if(full && dg && SCR.code) dg.innerHTML=SCR.code.split("").map(d=>`<span>${d}</span>`).join("");
  const gc=$("#givenCount"); if(gc) gc.textContent=t("todayGiven",{n:fmtN(SCR.given)});
  const q=$("#qr"); if(q && !q.firstChild && window.QRCode){
    const url=location.origin+location.pathname; const size=Math.min(220,Math.max(140,Math.round(innerWidth*0.18)));
    try{ new QRCode(q,{text:url,width:size,height:size,colorDark:"#1b1838",colorLight:"#ffffff"}); }catch(e){}
  }
}
function startScreen(){
  SCR.on=true; issue();
  SCR.timer=setInterval(()=>{ if(Date.now()-SCR.issuedAt>=CONFIG.codeSeconds*1000) issue(); else paintScreen(false); },250);
  if(navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>SCR.lock=l).catch(()=>{});
}
function stopScreen(){ if(!SCR.on) return; SCR.on=false; clearInterval(SCR.timer); if(SCR.unwatch) SCR.unwatch(); SCR.unwatch=null; SCR.code=null;
  try{ SCR.lock&&SCR.lock.release(); }catch(e){} }
function flash(){
  const f=document.createElement("div"); f.className="flash";
  f.innerHTML=`<div><span class="ball b8"><i>✓</i></span><h2>${t("given")}</h2></div>`;
  document.body.appendChild(f); setTimeout(()=>f.remove(),1800);
}

/* ---------------- owner: admin list ---------------- */
let adminUnsub=null;
function startAdmin(){ if(adminUnsub) return;
  adminUnsub=backend.watchCustomers(list=>{ S.customers=list; if(S.view==="admin") refreshAdminList(); },
    ()=>{ S.adminMsg={k:"err",t:t("err")}; render(); }); }
function stopAdmin(){ if(adminUnsub){ adminUnsub(); adminUnsub=null; } }
function refreshAdminList(){ // keep focus in search box
  const focused=document.activeElement&&document.activeElement.id==="adminSearch"; const pos=focused?document.activeElement.selectionStart:0;
  $("#app").innerHTML=viewAdmin();
  if(focused){ const s=$("#adminSearch"); s.focus(); try{ s.setSelectionRange(pos,pos);}catch(e){} }
}

/* ---------------- events ---------------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act],[data-lang]"); if(!b) return;
  if(b.dataset.lang){ S.lang=b.dataset.lang; try{localStorage.setItem("bro_lang",S.lang);}catch(x){} SCR.on? (render()) : render(); return; }
  const a=b.dataset.act;
  if(a==="signin"){ try{ await backend.signIn(); }catch(x){ S.msg={k:"err",t:t("err")}; render(); } }
  else if(a==="signout"){ S.msg=null; await backend.signOut(); }
  else if(a==="claim") claim();
  else if(a==="demo-code"){ const c=genCode(); await backend.issueCode(c); S.msg={k:"warn",t:t("demoCodeIs",{c})}; render(); }
  else if(a==="sheet-close"){ S.sheet=null; render(); }
  else if(a==="go-screen") location.hash="screen";
  else if(a==="go-admin") location.hash="admin";
  else if(a==="fs"){ const el=document.documentElement; (el.requestFullscreen?el.requestFullscreen():Promise.reject()).catch(()=>{}); }
  else if(a==="redeem"){ S.confirmUid=b.dataset.uid; S.adminMsg=null; refreshAdminList(); }
  else if(a==="redeem-no"){ S.confirmUid=null; refreshAdminList(); }
  else if(a==="redeem-yes"){
    const uid=b.dataset.uid; b.disabled=true;
    try{ await backend.giveReward(uid); S.adminMsg={k:"ok",t:t("redeemed")}; }catch(x){ S.adminMsg={k:"err",t:t("err")}; }
    S.confirmUid=null; refreshAdminList();
  }
});
document.addEventListener("input",e=>{ if(e.target.id==="adminSearch"){ S.search=e.target.value; refreshAdminList(); } });
document.addEventListener("submit",async e=>{
  if(e.target.id!=="demoForm") return; e.preventDefault();
  const name=$("#demoName").value.trim(); if(!name) return;
  S.sheet=null; await backend.demoCreate(name); render();
});
window.addEventListener("hashchange",route);
// refresh the cooldown line once in a while (not while typing)
setInterval(()=>{ if(S.view==="customer" && S.user && document.activeElement?.id!=="code" && !S.busy && !S.sheet) render(); }, DEMO?5000:30000);

/* ---------------- boot ---------------- */
let backend; let custUnsub=null;
(async function boot(){
  try{ backend = DEMO? makeDemo() : await makeFirebase(); }
  catch(e){ $("#app").innerHTML=`<div class="wrap"><div class="msg err">${t("err")}</div></div>`; return; }
  backend.onAuth(async u=>{
    S.user=u; S.authReady=true; S.customer=null; S.msg=null;
    if(custUnsub){ custUnsub(); custUnsub=null; }
    if(u){
      try{ await backend.ensureCustomer(u); }catch(e){}
      custUnsub=backend.watchCustomer(u.uid,c=>{
        const prev=S.customer; S.customer=c;
        if(S.justEarnedPending!=null && c && (c.stars||0)>S.justEarnedPending){ S.justEarned=S.justEarnedPending; S.justEarnedPending=null; }
        if(S.view==="customer" && document.activeElement?.id!=="code" || (prev&&c&&prev.stars!==c.stars)) render();
      });
    }
    route();
  });
  route();
})();
</script>
